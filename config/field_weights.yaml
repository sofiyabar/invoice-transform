# ASSUMPTION — веса критичных полей для Layer 2 (evals/layer2_document.py).
# Критичные поля весят больше при расчёте weighted document score
# и resolution rate / critical error rate.
#
# Rationale: an invoice is fundamentally wrong if it bills the wrong person
# or the wrong amount/items -- clientName and items are what make an invoice
# unusable without human review if they're incorrect. email/address are
# contact details: useful, but a human can add or correct them without
# re-running extraction. CRITICAL_FIELDS in evals/layer2_document.py
# (clientName, items) is the pair with the highest weight here -- keep them
# in sync if these numbers change.
clientName: 0.35
email: 0.10
address: 0.10
items: 0.45
